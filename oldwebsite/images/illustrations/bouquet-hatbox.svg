<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- ROSEALA original illustration: Flowers in the signature plum hatbox -->
  <defs>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E4CFB8"/>
      <stop offset="1" stop-color="#FFFBF4"/>
    </linearGradient>
    <radialGradient id="shade" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43263B"/>
      <stop offset="0.45" stop-color="#6A3F5E"/>
      <stop offset="1" stop-color="#43263B"/>
    </linearGradient>
    <g id="lily-petal">
      <path d="M0 0 C-15 -16 -14 -46 0 -68 C14 -46 15 -16 0 0Z" fill="url(#petal)" stroke="#CDB59C" stroke-width="1"/>
      <path d="M0 -6 C-1 -25 -1 -40 0 -58" stroke="#C7A88C" stroke-width="1.2" fill="none"/>
      <circle cx="-4" cy="-18" r="1.5" fill="#8C5A72"/><circle cx="4" cy="-23" r="1.5" fill="#8C5A72"/>
    </g>
    <g id="stamen">
      <path d="M0 -4 L0 -36" stroke="#A89466" stroke-width="1.4"/>
      <ellipse cy="-38" rx="2.4" ry="5" fill="#6B3B4F"/>
    </g>
    <g id="lily">
      <use href="#lily-petal" transform="rotate(30) scale(0.94)"/>
      <use href="#lily-petal" transform="rotate(150) scale(0.94)"/>
      <use href="#lily-petal" transform="rotate(270) scale(0.94)"/>
      <use href="#lily-petal" transform="rotate(90)"/>
      <use href="#lily-petal" transform="rotate(210)"/>
      <use href="#lily-petal" transform="rotate(330)"/>
      <circle r="8" fill="#B9C29A"/>
      <use href="#stamen"/><use href="#stamen" transform="rotate(60)"/><use href="#stamen" transform="rotate(120)"/>
      <use href="#stamen" transform="rotate(180)"/><use href="#stamen" transform="rotate(240)"/><use href="#stamen" transform="rotate(300)"/>
    </g>
    <g id="peony">
      <g fill="currentColor" stroke="#000" stroke-opacity="0.16" stroke-width="1.5">
        <ellipse cy="-30" rx="24" ry="20"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(45)"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(90)"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(135)"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(180)"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(225)"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(270)"/>
        <ellipse cy="-30" rx="24" ry="20" transform="rotate(315)"/>
        <circle r="30"/>
        <ellipse cy="-16" rx="16" ry="13" transform="rotate(30)"/>
        <ellipse cy="-16" rx="16" ry="13" transform="rotate(90)"/>
        <ellipse cy="-16" rx="16" ry="13" transform="rotate(150)"/>
        <ellipse cy="-16" rx="16" ry="13" transform="rotate(210)"/>
        <ellipse cy="-16" rx="16" ry="13" transform="rotate(270)"/>
        <ellipse cy="-16" rx="16" ry="13" transform="rotate(330)"/>
        <circle r="11"/>
      </g>
      <circle r="52" fill="url(#shade)"/>
      <path d="M-5 -2 C-5 -8 5 -8 5 -2 C5 4 -3 5 -3 0" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="1.4"/>
    </g>
    <g id="bud">
      <path d="M0 0 C-12 -6 -12 -26 0 -34 C12 -26 12 -6 0 0Z" fill="currentColor"/>
      <path d="M-10 -3 C-4 4 4 4 10 -3 L0 10Z" fill="#5E7259"/>
      <path d="M0 8 L0 40" stroke="#5E7259" stroke-width="2"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C18 -22 18 -58 0 -84 C-18 -58 -18 -22 0 0Z" fill="currentColor"/>
      <path d="M0 -4 L0 -76" stroke="#000" stroke-opacity="0.18" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Soft shadow under the box -->
  <ellipse cx="200" cy="452" rx="135" ry="20" fill="#43263B" opacity="0.15"/>

  <!-- Inside of the box -->
  <ellipse cx="200" cy="300" rx="115" ry="28" fill="#36202F"/>

  <!-- Greenery -->
  <use href="#leaf" color="#5E7259" transform="translate(200 290) rotate(-70) scale(1.3)"/>
  <use href="#leaf" color="#465744" transform="translate(200 290) rotate(68) scale(1.3)"/>
  <use href="#leaf" color="#465744" transform="translate(200 290) rotate(-38) scale(1.5)"/>
  <use href="#leaf" color="#5E7259" transform="translate(200 290) rotate(40) scale(1.5)"/>
  <use href="#leaf" color="#85866A" transform="translate(200 290) rotate(-8) scale(1.7)"/>

  <!-- Flowers -->
  <use href="#bud" color="#6E3F60" transform="translate(130 150) rotate(-28)"/>
  <use href="#bud" color="#EADBC8" transform="translate(278 140) rotate(26)"/>
  <use href="#lily" transform="translate(160 200) rotate(-15) scale(0.75)"/>
  <use href="#lily" transform="translate(252 190) rotate(10) scale(0.8)"/>
  <use href="#peony" color="#6E3F60" transform="translate(200 238) scale(1.1)"/>
  <use href="#peony" color="#EADBC8" transform="translate(128 268) scale(0.9)"/>
  <use href="#peony" color="#EADBC8" transform="translate(276 266) scale(0.95)"/>
  <use href="#peony" color="#59334F" transform="translate(98 290) scale(0.6)"/>
  <use href="#peony" color="#59334F" transform="translate(306 292) scale(0.62)"/>

  <!-- Box body -->
  <path d="M85 300 A115 28 0 0 0 315 300 L315 440 A115 28 0 0 1 85 440Z" fill="url(#box)"/>
  <path d="M85 300 A115 28 0 0 0 315 300" fill="none" stroke="#B39765" stroke-width="2"/>
  <path d="M85 440 A115 28 0 0 0 315 440" fill="none" stroke="#B39765" stroke-width="1"/>

  <!-- Green velvet ribbon -->
  <path d="M85 352 A115 28 0 0 0 315 352 L315 370 A115 28 0 0 1 85 370Z" fill="#465744" stroke="#B39765" stroke-width="0.8"/>
  <path d="M198 383 L184 428 L193 421 L197 432 L204 385Z" fill="#3A4A3A" stroke="#B39765" stroke-width="0.8"/>
  <path d="M202 383 L218 426 L209 420 L204 430 L196 385Z" fill="#3A4A3A" stroke="#B39765" stroke-width="0.8"/>
  <path d="M200 381 C176 360 154 368 162 386 C170 400 190 390 200 381Z" fill="#465744" stroke="#B39765"/>
  <path d="M200 381 C224 360 246 368 238 386 C230 400 210 390 200 381Z" fill="#465744" stroke="#B39765"/>
  <circle cx="200" cy="382" r="5" fill="#3A4A3A" stroke="#B39765"/>

  <!-- Wordmark on the box -->
  <text x="200" y="455" text-anchor="middle" font-family="'Cormorant Garamond', Garamond, Georgia, serif" font-size="15" letter-spacing="5" fill="#B39765">ROSEALA</text>
</svg>
