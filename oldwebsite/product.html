<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — ROSEALA</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="shop">

  <div id="site-header"></div>

  <main>
    <!-- Filled by js/pages/product.js using ?id=... from the address -->
    <section class="section section-tight">
      <div class="container" id="product-root"></div>
    </section>

    <section class="section section-tint" id="related-section" hidden>
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">You may also like</p>
          <h2>More from the Atelier</h2>
        </div>
        <div class="product-grid" id="related-products"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/product.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
