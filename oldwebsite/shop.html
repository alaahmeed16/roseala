<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Flowers — ROSEALA</title>
  <meta name="description" content="Shop luxury bouquets, roses, lilies, peonies, bridal flowers and orchids from ROSEALA.">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="shop">

  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <div class="container">
        <p class="eyebrow">The Collection</p>
        <h1 id="shop-title">All Flowers</h1>
        <p id="shop-subtitle">Hand-tied bouquets, arrangements and living gifts.</p>
      </div>
    </section>

    <section class="section section-tight">
      <div class="container">
        <div class="shop-toolbar">
          <div class="filter-list" id="category-filters" role="group" aria-label="Filter by category"></div>

          <div class="shop-selects">
            <label class="select-field">
              <span>Occasion</span>
              <select id="occasion-filter"></select>
            </label>
            <label class="select-field">
              <span>Sort</span>
              <select id="sort-order">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="name">Name A–Z</option>
              </select>
            </label>
          </div>
        </div>

        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="product-grid" id="product-grid"></div>

        <div class="empty-state" id="empty-state" hidden>
          <p>No flowers match these filters yet.</p>
          <button type="button" class="btn btn-outline" id="reset-filters">Show all flowers</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/shop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
