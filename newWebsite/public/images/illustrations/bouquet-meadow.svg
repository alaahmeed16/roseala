<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- ROSEALA original illustration: Hand-tied wild meadow bouquet -->
  <defs>
    <radialGradient id="shade" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <g id="daisy">
      <g fill="#FBF5EA" stroke="#D9C9B0" stroke-width="0.6">
        <ellipse cy="-11" rx="3.6" ry="8"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(36)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(72)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(108)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(144)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(180)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(216)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(252)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(288)"/>
        <ellipse cy="-11" rx="3.6" ry="8" transform="rotate(324)"/>
      </g>
      <circle r="4.5" fill="#B39765"/>
    </g>
    <g id="lavender">
      <path d="M0 0 L0 -220" stroke="#5E6A50" stroke-width="2"/>
      <g fill="#6E3F60">
        <ellipse cx="-4" cy="-150" rx="3.5" ry="7" transform="rotate(-20 -4 -150)"/>
        <ellipse cx="4" cy="-160" rx="3.5" ry="7" transform="rotate(20 4 -160)"/>
        <ellipse cx="-4" cy="-172" rx="3.5" ry="7" transform="rotate(-20 -4 -172)"/>
        <ellipse cx="4" cy="-183" rx="3.5" ry="7" transform="rotate(20 4 -183)"/>
        <ellipse cx="-3.5" cy="-195" rx="3" ry="6" transform="rotate(-20 -3.5 -195)"/>
        <ellipse cx="3.5" cy="-205" rx="3" ry="6" transform="rotate(20 3.5 -205)"/>
        <ellipse cx="0" cy="-216" rx="2.6" ry="5"/>
      </g>
    </g>
    <g id="sprig">
      <path d="M0 0 C4 -40 0 -80 6 -120" stroke="#4F5B48" stroke-width="2" fill="none"/>
      <g fill="#C3C4A8" stroke="#5E6A50" stroke-width="0.8">
        <circle cx="-8" cy="-18" r="9"/><circle cx="9" cy="-34" r="9"/><circle cx="-7" cy="-52" r="8"/>
        <circle cx="10" cy="-68" r="8"/><circle cx="-5" cy="-86" r="7"/><circle cx="10" cy="-102" r="6"/><circle cx="6" cy="-121" r="5"/>
      </g>
    </g>
    <g id="bud">
      <path d="M0 0 C-12 -6 -12 -26 0 -34 C12 -26 12 -6 0 0Z" fill="currentColor"/>
      <path d="M-10 -3 C-4 4 4 4 10 -3 L0 10Z" fill="#465744"/>
    </g>
    <g id="rose">
      <g fill="currentColor" stroke="#000" stroke-opacity="0.16" stroke-width="1.3">
        <ellipse cy="-22" rx="18" ry="15"/>
        <ellipse cy="-22" rx="18" ry="15" transform="rotate(72)"/>
        <ellipse cy="-22" rx="18" ry="15" transform="rotate(144)"/>
        <ellipse cy="-22" rx="18" ry="15" transform="rotate(216)"/>
        <ellipse cy="-22" rx="18" ry="15" transform="rotate(288)"/>
        <circle r="20"/>
        <path d="M-9 2 C-12 -10 2 -16 9 -8 C14 0 4 10 -4 6 C-9 2 -4 -6 2 -3" fill="none"/>
      </g>
      <circle r="38" fill="url(#shade)"/>
    </g>
  </defs>

  <!-- Stems below the tie -->
  <g stroke="#4F5B48" stroke-width="3" stroke-linecap="round">
    <path d="M196 380 L168 482"/><path d="M198 380 L184 488"/><path d="M200 380 L200 490"/>
    <path d="M202 380 L216 488"/><path d="M204 380 L232 482"/>
  </g>

  <!-- Greenery and lavender -->
  <use href="#sprig" transform="translate(200 380) rotate(-42) scale(1.9)"/>
  <use href="#sprig" transform="translate(200 380) rotate(40) scale(1.85)"/>
  <use href="#sprig" transform="translate(200 380) rotate(-12) scale(2.15)"/>
  <use href="#sprig" transform="translate(200 380) rotate(16) scale(2)"/>
  <use href="#lavender" transform="translate(200 380) rotate(-28) scale(1.15)"/>
  <use href="#lavender" transform="translate(200 380) rotate(24) scale(1.2)"/>
  <use href="#lavender" transform="translate(200 380) rotate(-4) scale(1.3)"/>

  <!-- Flower stems above the tie -->
  <g stroke="#4F5B48" stroke-width="2" fill="none">
    <path d="M200 380 L130 190"/><path d="M200 380 L160 140"/><path d="M200 380 L250 150"/>
    <path d="M200 380 L284 212"/><path d="M200 380 L198 205"/><path d="M200 380 L110 260"/><path d="M200 380 L300 270"/>
  </g>

  <!-- Flowers -->
  <use href="#bud" color="#59334F" transform="translate(300 270) rotate(40)"/>
  <use href="#bud" color="#F3EBDD" transform="translate(110 260) rotate(-45)"/>
  <use href="#daisy" transform="translate(160 140) scale(1.4)"/>
  <use href="#daisy" transform="translate(250 150) scale(1.3)"/>
  <use href="#rose" color="#59334F" transform="translate(198 210) scale(1.05)"/>
  <use href="#daisy" transform="translate(130 192) scale(1.5)"/>
  <use href="#daisy" transform="translate(284 212) scale(1.55)"/>
  <use href="#rose" color="#EADBC8" transform="translate(158 268) scale(0.85)"/>
  <use href="#rose" color="#6E3F60" transform="translate(246 270) scale(0.8)"/>
  <use href="#daisy" transform="translate(205 300) scale(1.2)"/>

  <!-- Forest green ribbon tie -->
  <rect x="184" y="372" width="32" height="16" rx="2" fill="#465744" stroke="#B39765" stroke-width="0.8"/>
  <path d="M200 380 C178 360 158 368 166 386 C173 400 192 390 200 380Z" fill="#465744" stroke="#B39765"/>
  <path d="M200 380 C222 360 242 368 234 386 C227 400 208 390 200 380Z" fill="#465744" stroke="#B39765"/>
  <path d="M198 384 L182 430 L191 424 L195 434 L203 386Z" fill="#3A4A3A" stroke="#B39765" stroke-width="0.8"/>
  <path d="M202 384 L220 428 L210 422 L205 432 L197 386Z" fill="#3A4A3A" stroke="#B39765" stroke-width="0.8"/>
  <circle cx="200" cy="381" r="5" fill="#3A4A3A" stroke="#B39765"/>
</svg>
